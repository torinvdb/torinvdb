<title>Torin's nav computer</title>
<style>
  text { font-family: 'Chakra Petch', 'Segoe UI', Verdana, sans-serif; }
  .ring { fill: none; stroke: #1e5d5a; stroke-width: 2; }
  .main { fill: none; stroke: #7fe8e0; stroke-width: 2.5; }
  .sector { fill: #7fe8e0; font-size: 30px; font-weight: 500; }
  .sys { fill: #7fe8e0; font-size: 25px; }
  .dot { fill: #e2fffb; animation: pulse 4s ease-in-out infinite; }
  .core { fill: #e2fffb; font-size: 32px; font-weight: 600; text-anchor: middle; }
  .core.sub { fill: #7fe8e0; font-size: 18px; font-weight: 400; }
  .sweep { transform-origin: 500px 500px; animation: sweep 8s linear infinite; }
  .r-small { fill: #7fe8e0; font-size: 26px; opacity: .8; }
  .r-big { fill: #e2fffb; font-size: 46px; font-weight: 600; }
  .r-mid { fill: #7fe8e0; font-size: 28px; }
  .r-row { fill: #7fe8e0; font-size: 24px; }
  .r-row.hot { fill: #e2fffb; font-weight: 600; }
  .caret { fill: #7fe8e0; animation: blink 1.1s steps(1) infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes sweep { to { transform: rotate(360deg); } }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .dot, .sweep, .caret { animation: none; } }
</style>
